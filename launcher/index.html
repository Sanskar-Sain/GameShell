<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; frame-src 'none'; object-src 'none'; base-uri 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="no-referrer">
  <title>GameShell</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="header-row">
        <h1>GameShell</h1>
        <div id="gpu-badge" class="badge badge-info">Checking…</div>
      </div>
      <p class="subtitle">Minimal game wrapper · Zero overhead</p>
    </header>

    <!-- Game list -->
    <section id="game-list-section">
      <div class="section-label">Library</div>
      <div id="game-list"></div>
    </section>

    <!-- Add game form -->
    <section id="add-game-section">
      <div class="section-label">Add Game</div>
      <form id="add-game-form" autocomplete="off">
        <div class="form-row">
          <input type="text" id="game-name" placeholder="Name" required maxlength="100" aria-label="Game name">
          <input type="url" id="game-url" placeholder="https://…" required maxlength="2048" aria-label="Game URL">
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </form>
    </section>

    <!-- Settings -->
    <section id="settings-section">
      <div class="section-label">Settings</div>
      <div class="settings-grid">
        <label class="toggle-label">
          <input type="checkbox" id="setting-vsync">
          <span class="label-text"><strong>V-Sync</strong> — prevent tearing (restart needed)</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="setting-highmem">
          <span class="label-text"><strong>High-Mem WASM</strong> — 8 GB heap + 2 GB shader cache</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="setting-fullscreen">
          <span class="label-text"><strong>Fullscreen</strong> — launch games in fullscreen</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="setting-overlay">
          <span class="label-text"><strong>FPS Overlay</strong> — show by default (<kbd>F3</kbd> to toggle)</span>
        </label>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <button id="btn-gpu-info" class="btn btn-ghost">GPU Info</button>
      <span class="footer-note" id="platform-note">—</span>
    </footer>
  </div>

  <script src="launcher.js"></script>
</body>
</html>
